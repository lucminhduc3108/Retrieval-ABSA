model_name: microsoft/deberta-v3-base
proj_dim: 256
tau: 0.07
batch_size: 128
epochs: 15
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_seq_length: 128
grad_clip: 1.0
patience: 3
seed: 42
triplets_path: data/processed/contrastive_triplets.jsonl
val_ratio: 0.1
ckpt_dir: checkpoints/embedding_2014_cls_attn
log_path: logs/embedding_2014_cls_attn_training.jsonl
# Stage 1: CLS head on backbone (768-dim)
num_polarities: 3
cls_polarity_weight: 1.0
# Stage 2: proj head on projected (256-dim)
proj_num_polarities: 3
proj_polarity_weight: 0.5
# Stage 3: attention pooling instead of CLS token
use_attention_pool: true
