model_name: microsoft/deberta-v3-base
proj_dim: 256
tau: 0.07
batch_size: 128
epochs: 15
lr: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_seq_length: 128
grad_clip: 1.0
patience: 5
seed: 42
triplets_path: data/processed/hard_contrastive_triplets.jsonl
val_ratio: 0.1
ckpt_dir: checkpoints/embedding_2014_cls_s2
log_path: logs/embedding_2014_cls_s2.jsonl
grad_accum_steps: 1
gradient_checkpointing: true
# Split loss: force polarity separation (alpha) vs category separation (beta)
loss_mode: split
loss_alpha: 1.0
loss_beta: 0.3
# CLS head on backbone (768-dim): force backbone to allocate capacity for polarity
num_polarities: 3
cls_polarity_weight: 1.0
